name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node's bundled
      # npm can lag behind this.
      - name: Update npm
        run: npm install -g npm@latest

      # The version commit below goes through the husky pre-commit hook, which
      # runs `claude plugin validate .` when plugin/marketplace files are staged
      # (every version bump syncs plugin.json).
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
